server {
    listen 80;
    server_name forwardforecasting.eu www.forwardforecasting.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forwardforecasting.eu www.forwardforecasting.eu;

    ssl_certificate     /etc/letsencrypt/live/forwardforecasting.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forwardforecasting.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Landing page (static)
    root /var/www/forwardforecasting;
    index index.html;

    location = / { try_files /index.html =404; }
    location = /logo.png { try_files /logo.png =404; }

    # SP500 bot — proxy to Streamlit
    location /SP500bot {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Facial Recognition notebook
    location /facial-recognition {
        alias /var/www/forwardforecasting/facial-recognition;
        index index.html;
        try_files $uri $uri/ /facial-recognition/index.html =404;
    }

    # Taxes visualiser
    location /taxes {
        alias /var/www/forwardforecasting/taxes;
        index index.html;
        try_files $uri $uri/ /taxes/index.html =404;
    }

    # DeePower placeholder
    location /DeePower {
        return 302 /;
    }
}
