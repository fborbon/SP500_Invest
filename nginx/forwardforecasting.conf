server {
    listen 80;
    server_name forwardforecasting.eu www.forwardforecasting.eu;

    # Redirect all HTTP to HTTPS
    return 301 https://www.forwardforecasting.eu$request_uri;
}

server {
    listen 443 ssl;
    server_name forwardforecasting.eu www.forwardforecasting.eu;

    ssl_certificate     /etc/letsencrypt/live/forwardforecasting.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forwardforecasting.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Streamlit needs WebSocket support
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
