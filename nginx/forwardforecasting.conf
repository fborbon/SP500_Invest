server {
    listen 80;
    server_name forwardforecasting.eu www.forwardforecasting.eu;

    # Landing page (static)
    root /var/www/forwardforecasting;
    index index.html;

    location = / { try_files /index.html =404; }
    location = /logo.png { try_files /logo.png =404; }

    # SP500 bot — proxy to Streamlit
    location /SP500bot {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # DeePower placeholder
    location /DeePower {
        return 302 /;
    }
}
